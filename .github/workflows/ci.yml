name: PRAHARI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt -r qa/requirements-dev.txt
          pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Import PRAHARI API
        working-directory: backend
        env:
          PRAHARI_AUTH_REQUIRED: "false"
        run: python -c "import main; print(main.app.version)"
      - name: Backend and satellite regressions
        run: python -m pytest qa/test_v9.py qa/test_satellite.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/prahari-browser --no-package-lock playwright@1.55.1
          node /tmp/prahari-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Satellite browser regressions
        working-directory: frontend
        run: |
          npm run dev -- --port 5173 > /tmp/prahari-vite.log 2>&1 &
          NODE_PATH=/tmp/prahari-browser/node_modules node ../qa/satellite_ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: satellite-ui-synthetic-fixtures
          path: test-results/
          retention-days: 7
